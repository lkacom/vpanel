name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: vpanel_testing
      DB_USERNAME: vpanel_test
      DB_PASSWORD: vpanel_test_password

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: vpanel_testing
          MYSQL_USER: vpanel_test
          MYSQL_PASSWORD: vpanel_test_password
          MYSQL_ROOT_PASSWORD: root_password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot_password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, curl, dom, gd, mbstring, pdo_mysql, xml, zip
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare application
        run: |
          cp .env.example .env
          php artisan key:generate --force --ansi
          php artisan migrate:fresh --force --ansi

      - name: Validate PHP syntax
        run: find app bootstrap config database Modules routes tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Run tests
        run: php artisan test --without-tty
